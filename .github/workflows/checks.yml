name: Django checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tkzone_ci
          POSTGRES_USER: tkzone_ci
          POSTGRES_PASSWORD: ci-only-not-a-production-credential
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tkzone_ci -d tkzone_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tkzone_ci:ci-only-not-a-production-credential@127.0.0.1:5432/tkzone_ci
      DJANGO_SECRET_KEY: isolated-ci-signing-key-not-used-outside-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node static/community/succession.test.cjs
      - run: node static/community/activity-imagery.test.cjs
      - run: node --check static/community/activity-image-review.js
      - run: node --check static/community/activity-imagery.js
      - run: node static/community/demo-state.test.cjs
      - run: node static/community/demo-weekly.test.cjs
      - run: node static/community/demo-session.test.cjs
      - run: node --check static/community/discovery-saves.js
      - run: node --check static/community/ask-tk.js
      - run: node --check static/community/ai-effects.js
      - run: node --check static/community/demo.js
      - run: node --check static/community/voice-search.js
      - run: node --check static/community/organizer-ai.js
      - run: node --check static/community/demo-moderation.js
      - run: node --check static/community/team-upload.js
      - run: pip install -r requirements.txt
      - run: python manage.py collectstatic --noinput
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test community.tests community.test_features community.test_migrations community.test_persistence community.test_organizers community.test_demo community.test_release_a community.test_about_team community.test_expansion community.test_about_refresh community.test_photo_administrator_grant community.test_inline_portraits community.test_portrait_publication community.test_finder_claude community.test_demo_match community.test_voice community.test_weekly_summary community.test_activity_draft community.test_demo_moderation community.test_ask_tk community.test_imagery community.test_brand_roles community.test_activity_imagery community.test_family_discovery --noinput
