{% load ui %}<button type="button" class="nav-menu-toggle" aria-controls="unified-sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>{% ui 'Menu' %}</span></button><aside class="sidebar product-sidebar unified-sidebar" id="unified-sidebar"><nav class="unified-navigation" aria-label="{% ui 'Main navigation' %}">{% for item in unified_navigation %}<a href="{{ item.url }}" data-nav-key="{{ item.key }}" {% if item.active %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ item.icon_path }}"/></svg><span>{{ item.label|ui }}</span></a>{% endfor %}</nav></aside>
