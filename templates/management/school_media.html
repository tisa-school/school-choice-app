{% extends 'base.html' %}{% load ui %}{% block content %}<a href="{% url 'management_edit' 'schools' school_profile.pk %}">← {{ school_profile.name }}</a><h1>{% ui 'Manage permitted school photography' %}</h1><form class="glass management-form" method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_div }}<button class="button">{% ui 'Save photo' %}</button></form><div class="management-list">{% for photo in photos %}<article class="glass"><p data-user-content>{{ photo.description }} · {{ photo.credit }}</p><form method="post" action="{% url 'management_school_media_delete' photo.pk %}">{% csrf_token %}<button class="button secondary">{% ui 'Delete photo' %}</button></form></article>{% endfor %}</div>{% endblock %}
