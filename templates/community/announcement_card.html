<article class="glass announcement-card">{% if item.is_pinned %}<span class="ribbon">PINNED ✦</span>{% endif %}<p class="eyebrow">SCHOOL NOTE · {{ item.published_at|date:'M d, Y' }}</p><h3>{{ item.title }}</h3>{% if item.image %}<img class="announcement-image" src="{% url 'private_media' 'announcement' item.pk %}" alt="Image for {{ item.title }}" loading="lazy">{% endif %}<div class="prose">{{ item.body|linebreaksbr }}</div><p class="attribution">✦ {{ member.school.name }}</p></article>
