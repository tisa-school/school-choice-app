<article class="glass announcement-card">{% if item.is_pinned %}<span class="ribbon">PINNED ✦</span>{% endif %}<p class="eyebrow">SCHOOL NOTE · {{ item.published_at|date:'M d, Y' }}</p><h3><span data-user-content>{{ item.title  }}</span></h3>{% if item.image %}<img class="announcement-image" src="{% url 'private_media' 'announcement' item.pk %}" alt="Image for {{ item.title }}" loading="lazy">{% endif %}<div class="prose"><span data-user-content>{{ item.body|linebreaksbr  }}</span></div><p class="attribution">✦ <span data-user-content>{{ member.school.name  }}</span></p></article>
