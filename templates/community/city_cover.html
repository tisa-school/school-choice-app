{% load ui %}{% activity_cover event as cover %}{% if cover.small %}<img class="city-cover" src="{{ cover.small }}" {% if cover.large %}srcset="{{ cover.small }} 768w, {{ cover.large }} 1536w" sizes="(max-width: 600px) 100vw, (max-width: 1100px) 50vw, 720px"{% endif %} width="1536" height="1024" alt="{{ cover.alt }}" loading="lazy" decoding="async"><small class="city-image-caption" data-user-content>{{ cover.caption }}</small>{% else %}<div class="activity-image-placeholder" role="img" aria-label="{{ cover.alt }}"><span aria-hidden="true">✦</span><strong>{{ event.category|ui }}</strong><small>{{ cover.caption }}</small></div>{% endif %}
