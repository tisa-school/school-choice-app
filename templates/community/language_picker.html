{% load ui %}<form class="language-picker" method="get"><label for="interface-language" class="sr-only">{% ui 'Choose language' %}</label>{% for key,value in language_query %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}<select data-user-content id="interface-language" name="lang" aria-label="{% ui 'Choose language' %}">{% for code,name in ui_languages %}<option value="{{ code }}" {% if ui_locale == code %}selected{% endif %}>{{ name }}</option>{% endfor %}</select><button type="submit" aria-label="{% ui 'Apply language' %}"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></button></form>
